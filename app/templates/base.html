<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}UniLab Central{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Main Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="{{ url_for('catalogue') }}">
                UniLab Central
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <div class="navbar-nav ms-auto">

                    <a class="nav-link" href="{{ url_for('catalogue') }}">
        Equipment Catalogue
    </a> {% if current_user.is_authenticated %}

                    <a class="nav-link" href="{{ url_for('my_bookings') }}">
            My Bookings
        </a>

                    <span class="navbar-text text-light me-lg-3">
            Hello, {{ current_user.username }}
        </span>

                    <form method="POST" action="{{ url_for('auth.logout') }}" class="d-inline">
                        <button type="submit" class="btn btn-outline-light mt-2 mt-lg-0">
                Logout
            </button>
                    </form>

                    {% else %}

                    <a class="nav-link" href="{{ url_for('auth.login') }}">
            Login
        </a>

                    <a class="nav-link" href="{{ url_for('auth.register') }}">
            Register
        </a> {% endif %}

                    <a class="btn btn-outline-light ms-lg-3 mt-2 mt-lg-0" href="{{ url_for('admin_login') }}">
        Admin Panel
    </a>

                </div>

            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
